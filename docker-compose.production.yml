version: '3.8'

# nopCommerce Production Deployment for OCI Always Free ARM Instance
# Optimized for ARM-based Ampere A1 VM (4 OCPUs, 24 GB memory)

services:
  nopcommerce_web:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    container_name: nopcommerce_web
    restart: unless-stopped
    ports:
      - "5000:80"  # Internal port mapping
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=nopcommerce_database;Port=3306;Database=nopcommerce_prod;Uid=nopcommerce_user;Pwd=${DB_PASSWORD:-nopCommerce_secure_password_2024}
    depends_on:
      nopcommerce_database:
        condition: service_healthy
    volumes:
      - nopcommerce_data:/app/App_Data
      - nopcommerce_logs:/app/logs
      - nopcommerce_plugins:/app/Plugins
      - nopcommerce_themes:/app/Themes
      - nopcommerce_wwwroot_images:/app/wwwroot/images
    networks:
      - nopcommerce_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  nopcommerce_database:
    image: mysql:8.0
    container_name: nopcommerce_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-nopCommerce_root_password_2024}
      MYSQL_DATABASE: nopcommerce_prod
      MYSQL_USER: nopcommerce_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-nopCommerce_secure_password_2024}
    volumes:
      - nopcommerce_db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - nopcommerce_network
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=512M
      --max-connections=150
      --innodb-log-file-size=256M
      --innodb-flush-log-at-trx-commit=2
      --query-cache-type=1
      --query-cache-size=64M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "nopcommerce_user", "-p${DB_PASSWORD:-nopCommerce_secure_password_2024}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  nginx:
    image: nginx:alpine
    container_name: nopcommerce_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nopcommerce_static:/var/www/static:ro
    depends_on:
      - nopcommerce_web
    networks:
      - nopcommerce_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.2'

  redis:
    image: redis:7-alpine
    container_name: nopcommerce_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-nopCommerce_redis_password_2024} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - nopcommerce_redis_data:/data
    networks:
      - nopcommerce_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.2'

volumes:
  nopcommerce_data:
    driver: local
  nopcommerce_logs:
    driver: local
  nopcommerce_plugins:
    driver: local
  nopcommerce_themes:
    driver: local
  nopcommerce_wwwroot_images:
    driver: local
  nopcommerce_db_data:
    driver: local
  nopcommerce_redis_data:
    driver: local
  nopcommerce_static:
    driver: local

networks:
  nopcommerce_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16